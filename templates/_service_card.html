<a href="{{ url_for('main.service_detail', service_id=s.id) }}" class="tile flex flex-col">
  <div class="flex items-start justify-between gap-3">
    <h3 class="font-semibold text-lg leading-tight">{{ s.name }}</h3>
    <span class="shrink-0 rounded-full bg-[color:var(--accent)] px-3 py-1 text-xs text-white">{{ s.rating }} ★</span>
  </div>
  <p class="mt-1 text-sm text-neutral-500">{{ s.category }}</p>
  <div class="mt-4 space-y-1 text-sm text-neutral-600"><p>📍 {{ s.distance_km }} km away</p><p>💰 {{ s.price_range }}</p><p>🕘 {{ s.opening_hours }}</p></div>
  <div class="mt-auto pt-5"><span class="btn-light w-full">View Details</span></div>
</a>
